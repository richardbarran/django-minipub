[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "django-minipub"
description = "A minimalist publication control system for Django."
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.txt"]
dynamic = ["version"]
authors = [
    { name = "Richard Barran", email = "richard@arbee.design" },
]
dependencies = [
    "Django>=5.2,<6.1",
    "django-model-utils==5.0.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/richardbarran/django-minipub"
Documentation = "https://django-minipub.readthedocs.io/"
Repository = "https://github.com/richardbarran/django-minipub"
Issues = "https://github.com/richardbarran/django-minipub/issues"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
include = ["minipub*"]

[tool.setuptools.dynamic]
version = { attr = "minipub.__version__" }

[tool.zest-releaser]
python-file-with-version = "minipub/__init__.py"
push-changes = false
release = false
upload-pypi = false
"prereleaser.before" = ["release.releaser_hooks.prereleaser_before"]
"postreleaser.after" = ["release.releaser_hooks.trigger_pypi_workflow"]

[tool.coverage.run]
source = ['minipub']
